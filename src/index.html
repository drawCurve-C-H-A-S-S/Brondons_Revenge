<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brondon's Revenge</title>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <div id="crosshair" aria-hidden="true"></div>
  <div id="interact-prompt" class="hidden">Press E to open chest</div>
  <div id="hud">
    <div id="fps">FPS: --</div>
    <div id="info">WASD: move | Shift: sprint | V: view<br><span id="weapon-status">K: equip pistol</span></div>
    <div id="health-bar"><div id="health-bar-fill"></div><div id="health-bar-label">100 / 100</div></div>
    <button id="view-toggle-btn">1st Person</button>
  </div>
  
  <!-- Credit roll overlay -->
  <div id="credits-overlay" class="hidden">
    <div id="credits-content">
      <div class="credit-title">THE DONS REVENGE</div>
      <div class="credit-section">
        <div class="credit-role">CREATED BY</div>
        <div class="credit-name">CHASS</div>
      </div>
      <div class="credit-section">
        <div class="credit-role">3D ENGINE</div>
        <div class="credit-name">Three.js</div>
      </div>
      <div class="credit-section">
        <div class="credit-role">SPECIAL THANKS TO </div>
        <div class="credit-name">YOUR MOM</div>
      </div>
      <div class="credit-section">
        <div class="credit-role">PHYSICS</div>
        <div class="credit-name">Cannon-es</div>
      </div>
    </div>
  </div>
  
  <!-- Menu buttons -->
  <div id="menu-buttons" class="hidden">
    <button id="play-btn" class="menu-btn">PLAY</button>
    <button id="quit-btn" class="menu-btn">DON'T PLAY</button>
  </div>
  
  <!-- Fade overlay for transitions -->
  <div id="fade-overlay" class="hidden"></div>
  
  <!-- Skip button for scene one -->
  <button id="skip-btn" class="hidden">SKIP</button>
  
  <script type="module" src="./main.ts"></script>
</body>
</html>
